[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-v1-direction-decoder"
version = "0.1.0"
description = "Evaluation utilities for decoding drifting-grating labels from mouse VISp activity"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.10,<4",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = ["jupyter>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]
